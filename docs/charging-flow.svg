<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="470" viewBox="0 0 1440 470" role="img" aria-labelledby="title desc">
  <title id="title">EV Neighbor Charger session flow</title>
  <desc id="desc">An administrator allows a user, the user starts charging in Home Assistant, the integration tracks energy and cost, then automatically turns off the charger after the configured idle delay.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5fbff"/>
      <stop offset="1" stop-color="#edf5fb"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25c7e8"/>
      <stop offset="1" stop-color="#0786cd"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#17466b" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1440" height="470" rx="30" fill="url(#bg)"/>
  <text x="64" y="70" fill="#123451" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="700">A clear, controlled charging flow</text>
  <text x="64" y="105" fill="#557287" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Home Assistant verifies the user, controls the relay and keeps the session record.</text>

  <g filter="url(#shadow)">
    <rect x="52" y="150" width="296" height="244" rx="22" fill="#fff"/>
    <rect x="396" y="150" width="296" height="244" rx="22" fill="#fff"/>
    <rect x="740" y="150" width="296" height="244" rx="22" fill="#fff"/>
    <rect x="1084" y="150" width="304" height="244" rx="22" fill="#fff"/>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <!-- 1: authorized user -->
    <circle cx="200" cy="225" r="42" fill="#e7f8fd"/>
    <circle cx="200" cy="213" r="12" fill="#0786cd"/>
    <path d="M176 246c3-15 12-23 24-23s21 8 24 23" fill="none" stroke="#0786cd" stroke-width="9" stroke-linecap="round"/>
    <circle cx="229" cy="244" r="13" fill="#20bd9b"/>
    <path d="m223 244 4 4 8-9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="298" fill="#123451" font-size="20" font-weight="700">1 · Allow-list</text>
    <text x="78" y="330" fill="#557287" font-size="15">Admin selects which Home</text>
    <text x="78" y="352" fill="#557287" font-size="15">Assistant users may charge.</text>

    <!-- 2: tap start -->
    <circle cx="544" cy="225" r="42" fill="#e7f8fd"/>
    <rect x="523" y="198" width="42" height="55" rx="8" fill="none" stroke="#0786cd" stroke-width="4"/>
    <rect x="530" y="205" width="28" height="28" rx="6" fill="url(#blue)"/>
    <path d="m540 210-4 8h6l-2 9 8-11h-6l3-6z" fill="#fff"/>
    <circle cx="544" cy="245" r="2.5" fill="#0786cd"/>
    <text x="422" y="298" fill="#123451" font-size="20" font-weight="700">2 · Start in Home Assistant</text>
    <text x="422" y="330" fill="#557287" font-size="15">The signed-in account starts</text>
    <text x="422" y="352" fill="#557287" font-size="15">a session with one tap.</text>

    <!-- 3: track session -->
    <circle cx="888" cy="225" r="42" fill="#fff5df"/>
    <path d="M877 197h22v9h7v13h-7v23h-22v-23h-7v-13h7z" fill="none" stroke="#d79213" stroke-width="4" stroke-linejoin="round"/>
    <path d="M888 207v15m-7-8h14" stroke="#d79213" stroke-width="4" stroke-linecap="round"/>
    <text x="766" y="298" fill="#123451" font-size="20" font-weight="700">3 · Track the session</text>
    <text x="766" y="330" fill="#557287" font-size="15">Energy, user and cost are</text>
    <text x="766" y="352" fill="#557287" font-size="15">saved in Home Assistant.</text>

    <!-- 4: idle shutoff -->
    <circle cx="1236" cy="225" r="42" fill="#e7f8fd"/>
    <circle cx="1236" cy="225" r="25" fill="none" stroke="#0786cd" stroke-width="4"/>
    <path d="M1236 210v16l11 7" fill="none" stroke="#0786cd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1263 205v40m-8-8 8 8 8-8" fill="none" stroke="#20bd9b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1110" y="298" fill="#123451" font-size="20" font-weight="700">4 · Automatic shutoff</text>
    <text x="1110" y="330" fill="#557287" font-size="15">Low power lasts through the</text>
    <text x="1110" y="352" fill="#557287" font-size="15">configured delay: relay off.</text>
  </g>

  <g fill="none" stroke="#74b9d2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M355 272h30m-9-9 9 9-9 9"/>
    <path d="M699 272h30m-9-9 9 9-9 9"/>
    <path d="M1043 272h30m-9-9 9 9-9 9"/>
  </g>
</svg>
