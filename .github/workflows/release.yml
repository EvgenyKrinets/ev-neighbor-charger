name: Publish versioned release
on:
  push:
    branches: [main]
    paths:
      - custom_components/ev_neighbor_charger/manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate package
        run: |
          python -m compileall -q custom_components
          python -m unittest discover -s tests
          node --check custom_components/ev_neighbor_charger/panel.js
          if [ -f tests/test_panel_live.cjs ]; then node --test tests/test_panel_live.cjs; fi
      - name: Publish release matching manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("custom_components/ev_neighbor_charger/manifest.json"))["version"])')
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "EV Neighbor Charger $VERSION" --notes-file RELEASE_NOTES.md --latest
